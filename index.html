<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one narrow column. Tabs on top switch between five short lessons, each built around a board you can look at or tap. */
  :root {
    --bg: #f2f4f3;
    --surface: #ffffff;
    --fg: #16222b;
    --muted: #566471;
    --line: #d9e0de;
    --accent: #1d5c55;
    --accent-ink: #ffffff;
    --sq-light: #e8eeec;
    --sq-dark: #5b8a84;
    --hint: #e0a526;
    --warn: #8f6200;
    --bad: #c93f36;
    --good: #1b7f55;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1618; --surface: #172123; --fg: #e8efed; --muted: #9bacaa; --line: #26353a;
      --accent: #6fc7b9; --accent-ink: #08201c; --sq-light: #cfdad7; --sq-dark: #4f7f79;
      --hint: #f0bb43; --warn: #f0bb43; --bad: #ef6a60; --good: #4fcf94;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1618; --surface: #172123; --fg: #e8efed; --muted: #9bacaa; --line: #26353a;
    --accent: #6fc7b9; --accent-ink: #08201c; --sq-light: #cfdad7; --sq-dark: #4f7f79;
    --hint: #f0bb43; --warn: #f0bb43; --bad: #ef6a60; --good: #4fcf94;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  [hidden] { display: none !important; }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 6px; text-wrap: balance; }
  p { margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 6px 0 0; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    font: 700 0.9rem var(--font-body);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab:focus-visible, .pick:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }

  .panel { display: grid; gap: 14px; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }

  .board {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--sq-dark);
    user-select: none;
  }
  .sq { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; }
  .sq.l { background: var(--sq-light); }
  .sq.d { background: var(--sq-dark); }
  .sq .co { position: absolute; font-size: 0.6rem; font-weight: 700; line-height: 1; opacity: 0.8; }
  .sq .rk { top: 3px; left: 3px; }
  .sq .fl { bottom: 3px; right: 3px; }
  .sq.l .co { color: var(--sq-dark); }
  .sq.d .co { color: var(--sq-light); }
  .sq.tap { cursor: pointer; }
  .sq.dot::after { content: ""; width: 28%; height: 28%; border-radius: 50%; background: var(--hint); opacity: 0.95; }
  .sq.ring::after { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 4px solid var(--hint); }
  .sq.mate { background: var(--bad); }
  .sq.here { box-shadow: inset 0 0 0 3px var(--accent); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--hint); opacity: 0.38; }
  .sq.hintsq { box-shadow: inset 0 0 0 4px var(--good); }

  .status { font-weight: 700; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn.alt { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .log { display: grid; gap: 10px; }
  .entry { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .entry h3 { font-family: var(--font-display); font-size: 1rem; margin: 0 0 6px; }
  .entry h3.good { color: var(--good); }
  .entry h3.warn { color: var(--hint); }
  .entry h3.bad { color: var(--bad); }
  .entry h3.hint { color: var(--accent); }
  .entry h3.info { color: var(--muted); }

  .pc {
    font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", "DejaVu Sans", serif;
    font-size: clamp(1.6rem, 9vw, 2.7rem);
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .pc.w { color: #ffffff; text-shadow: 0 0 2px #111, 0 0 2px #111, 0 1px 1px #111; }
  .pc.b { color: #13161c; text-shadow: 0 0 1px rgba(255,255,255,0.35); }

  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick {
    font: 700 0.9rem var(--font-body);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .legend { color: var(--muted); font-size: 0.9rem; margin: 0; }
  ul.clean { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .val { display: inline-block; font-weight: 700; color: var(--accent); }

  .qtext { font-weight: 700; margin-bottom: 10px; }
  .opts { display: grid; gap: 8px; }
  .opt {
    text-align: left;
    font: 600 1rem var(--font-body);
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
  }
  .opt.ok { border-color: var(--good); background: var(--surface); box-shadow: inset 0 0 0 2px var(--good); }
  .opt.no { border-color: var(--bad); background: var(--surface); box-shadow: inset 0 0 0 2px var(--bad); }
  .fb { margin: 10px 0 0; min-height: 1.5em; }
  .btn {
    font: 700 0.95rem var(--font-body);
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
  }
  .progress { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; font-variant-numeric: tabular-nums; }

  /* Polish layer */
  main { max-width: 560px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { flex: none; width: 54px; height: 54px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 2.1rem/1 "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", serif; }
  h1 { font-size: 1.8rem; letter-spacing: -0.01em; }
  .sub { max-width: 60ch; margin-top: 12px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 8px 0; scroll-snap-type: x proximity; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; white-space: nowrap; scroll-snap-align: center; transition: background-color .15s, color .15s; }
  .tab:hover:not([aria-selected="true"]) { background: var(--bg); }
  .panel:not([hidden]) { animation: panelin .2s ease-out; }
  @keyframes panelin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card, .entry { border-radius: 14px; box-shadow: 0 1px 2px rgba(15, 40, 38, 0.06); }
  .board { border: 0; border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 8px 22px rgba(15, 40, 38, 0.14); }
  .sq.tap:hover { filter: brightness(1.07); }
  .pc { font-size: clamp(1.8rem, 9.5vw, 3.1rem); }
  .status { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .btn { transition: filter .15s, transform .1s; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.alt:hover:not(:disabled) { background: var(--bg); filter: none; }
  .entry { border-left: 4px solid var(--line); }
  .entry:has(h3.good) { border-left-color: var(--good); }
  .entry:has(h3.warn) { border-left-color: var(--hint); }
  .entry:has(h3.bad) { border-left-color: var(--bad); }
  .entry:has(h3.hint) { border-left-color: var(--accent); }
  .entry h3.warn { color: var(--warn); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
  .foot { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 6px 0 0; text-wrap: balance; }
  .sq, .tab, .btn, .pick, .opt { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .tab { min-height: 44px; padding: 10px 16px; }
  .btn, .pick { min-height: 44px; }
  .opt { min-height: 48px; }
  .row .btn { flex: 1 1 auto; }
  @media (max-width: 420px) {
    body { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
    h1 { font-size: 1.5rem; }
    .logo { width: 46px; height: 46px; font-size: 1.8rem; border-radius: 13px; }
    .sub { font-size: 0.95rem; }
    .card { padding: 12px 14px; }
    #hintBtn { flex-basis: 100%; }
  }
  @media (min-width: 900px) {
    main { max-width: 1000px; }
    .row .btn { flex: 0 0 auto; }
    #p-board, #p-play, #p-mate, #p-pieces { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 18px 28px; }
    #p-special { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
    #p-pieces .picks { grid-column: 1 / -1; }
    #p-pieces .board { grid-column: 1; grid-row: 2 / span 2; }
    #p-pieces .legend { grid-column: 2; grid-row: 2; }
    #p-pieces #pinfo { grid-column: 2; grid-row: 3; }
    #p-mate .board { grid-column: 1; grid-row: 1 / span 3; }
    #p-mate .legend, #p-mate .card { grid-column: 2; }
    #p-quiz { max-width: 640px; width: 100%; margin: 0 auto; }
  }
  .setup { display: grid; gap: 12px; }
  .setrow { display: grid; gap: 6px; }
  .lbl { font-weight: 700; font-size: 0.9rem; color: var(--muted); }
  .status.over { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #promo { border-color: var(--hint); }
  #playNow { min-height: 48px; padding: 12px 22px; font-size: 1rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  .lang { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 10px; }
  .lg { font: 700 0.8rem var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .lg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .lg:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
</style>

<main>
  <header>
    <div class="lang" role="group" aria-label="Language" data-ia="lang_label"><button class="lg" type="button" data-lang="en" aria-pressed="true">English</button><button class="lg" type="button" data-lang="ur" aria-pressed="false">Roman Urdu</button></div>
    <div class="brand"><div class="logo" aria-hidden="true">&#9822;&#xFE0E;</div><h1 data-i="h1">Learn Chess</h1></div>
    <p class="sub" data-i="sub"></p>
    <p><button class="btn" id="playNow" type="button" data-i="play_now"></button></p>
  </header>

  <div class="tabs" role="tablist" aria-label="Lessons" data-ia="tabs_aria">

    <button class="tab" role="tab" data-tab="special" aria-selected="false" data-i="tab_special"></button>
    <button class="tab" role="tab" data-tab="mate" aria-selected="false" data-i="tab_mate"></button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false" data-i="tab_quiz"></button>

  </div>

  <section class="panel" role="tabpanel" id="p-board">
    <div class="board" id="b-start" role="img" aria-label="Chess board in the starting position" data-ia="b_aria"></div>

      <h2 data-i="b_h2"></h2>

        <li data-ih="b_l1"></li>
        <li data-ih="b_l2"></li>
        <li data-ih="b_l3"></li>
        <li data-ih="b_l4"></li>
        <li data-ih="b_l5"></li>
        <li data-ih="b_l6"></li>

  <section class="panel" role="tabpanel" id="p-pieces" hidden>
    <div class="picks" id="picks" role="group" aria-label="Choose a piece" data-ia="pick_aria"></div>

    <p class="legend" data-i="p_legend"></p>
    <div class="card" id="pinfo"></div>
  </section>

  <section class="panel" role="tabpanel" id="p-special" hidden>

      <h2 data-i="sp_cast_h"></h2>

    <div class="board" id="b-mate" role="img" aria-label="Back rank checkmate" data-ia="m_aria"></div>
    <p class="legend" data-ih="m_legend"></p>
    <div class="card">
      <h2 data-i="m_h"></h2>
      <ul class="clean">
        <li data-ih="m_l1"></li>
        <li data-i="m_l2"></li>
        <li data-ih="m_l3"></li>
        <li data-ih="m_l4"></li>
      </ul>
    </div>
    <div class="card">
      <h2 data-i="o_h"></h2>
      <ul class="clean">
        <li data-i="o_l1"></li>

        <li data-i="o_l3"></li>
        <li data-i="o_l4"></li>
        <li data-i="o_l5"></li>

  <section class="panel" role="tabpanel" id="p-play" hidden>

    </div>

    <p class="legend" data-i="pl_legend"></p>

    </div>
  </section>

  <section class="panel" role="tabpanel" id="p-quiz" hidden>
    <div class="card" id="quiz"></div>
  </section>
  <p class="foot" data-i="foot"></p>
</main>

   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square'
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(tokens[5]) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(tokens[4]) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */

      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }

    function add_move(board, moves, from, to, flags) {

      if (

    var legal =

    if (typeof options !== 'undefined' && 'square' in options) {

      if (i & 0x88) {

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {

        /* pawn captures */
        for (j = 2; j < 4; j++) {

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)

            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }

          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)

            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square

    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }
      }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation

   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {

       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))
      }
      return keys
    })(),
    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete comments */
      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves
        .join(',')
        .replace(/,,+/g, ',')
        .split(',')
      var move = ''

      for (var half_move = 0; half_move < moves.length - 1; half_move++) {
        move = move_from_san(moves[half_move], sloppy)

        /* move not possible! (don't clear the board to examine to show the
         * latest valid position)
         */
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }

      /* examine last move */
      move = moves[moves.length - 1]
      if (POSSIBLE_RESULTS.indexOf(move) > -1) {
        if (has_keys(header) && typeof header.Result === 'undefined') {
          set_header(['Result', move])
        }
      } else {
        move = move_from_san(move, sloppy)
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }
      return true
    },

    header: function() {

    ascii: function() {

    turn: function() {

    move: function(move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })

      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function() {
      var move = undo_move()
      return move ? make_pretty(move) : null

    clear: function() {
      return clear()

    put: function(piece, square) {

  /* Lesson 6: play against the computer with a coach */
  var PVAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
  var EVAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
  var PNAME = { p: "Pawn", n: "Knight", b: "Bishop", r: "Rook", q: "Queen", k: "King" };
  var deadline = Infinity;

  function evalWhite(g) {
    var b = g.board(), s = 0;
    for (var r = 0; r < 8; r++) {
      for (var f = 0; f < 8; f++) {
        var p = b[r][f];
        if (!p) continue;
        var rank = 7 - r;
        var rel = p.color === "w" ? rank : 7 - rank;
        var v = EVAL[p.type];
        var cen = (3.5 - Math.abs(f - 3.5)) + (3.5 - Math.abs(rank - 3.5));
        if (p.type === "n" || p.type === "b") v += cen * 5 + (rel > 0 ? 20 : 0);
        else if (p.type === "p") v += rel * (f === 3 || f === 4 ? 12 : (f === 0 || f === 7 ? 2 : 6)) + cen * 2;
        else if (p.type === "q") v += cen;
        else if (p.type === "k" && rel === 0 && (f <= 2 || f >= 6)) v += 25;
        s += p.color === "w" ? v : -v;
      }
    }
    return s;
  }

  function order(a, b) {
    function key(m) {
      return (m.captured ? EVAL[m.captured] * 10 - EVAL[m.piece] : 0) + (m.promotion ? 800 : 0);
    }
    return key(b) - key(a);
  }

  function quiesce(g, alpha, beta, qd) {
    var stand = (g.turn() === "w" ? 1 : -1) * evalWhite(g);
    if (qd === 0) return stand;
    if (stand >= beta) return stand;
    if (stand > alpha) alpha = stand;
    var ms = g.moves({ verbose: true }).filter(function (m) { return m.captured; });
    ms.sort(order);
    for (var i = 0; i < ms.length; i++) {
      g.move(ms[i]);
      var sc = -quiesce(g, -beta, -alpha, qd - 1);
      g.undo();
      if (sc >= beta) return sc;
      if (sc > alpha) alpha = sc;
    }
    return alpha;
  }

  function nega(g, depth, alpha, beta) {
    if (Date.now() > deadline) throw new Error("timeout");
    if (depth === 0) {
      if (g.in_check() && g.moves().length === 0) return -100000;
      return quiesce(g, alpha, beta, 2);
    }
    var ms = g.moves({ verbose: true });
    if (ms.length === 0) return g.in_check() ? -100000 - depth : 0;
    ms.sort(order);
    var best = -Infinity;
    for (var i = 0; i < ms.length; i++) {
      g.move(ms[i]);
      var sc = -nega(g, depth - 1, -beta, -alpha);
      g.undo();
      if (sc > best) best = sc;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function rootScores(g, depth) {
    var ms = g.moves({ verbose: true });
    ms.sort(order);
    return ms.map(function (m) {
      g.move(m);
      var sc = -nega(g, depth - 1, -Infinity, Infinity);
      g.undo();
      return { m: m, s: sc };
    });
  }

  function bestMove(g, depth) {
    var ms = g.moves({ verbose: true });
    ms.sort(order);
    var best = null, alpha = -Infinity;
    for (var i = 0; i < ms.length; i++) {
      g.move(ms[i]);
      var sc = -nega(g, depth - 1, -Infinity, -alpha);
      g.undo();
      if (sc > alpha) { alpha = sc; best = ms[i]; }
    }
    return best || ms[0];
  }

  function bestTimed(g) {
    var n = g.history().length;
    var b2 = bestMove(g, 2);
    deadline = Date.now() + 2500;
    try {
      var b3 = bestMove(g, 3);
      deadline = Infinity;
      return b3;
    } catch (e) {
      deadline = Infinity;
      while (g.history().length > n) g.undo();
      return b2;
    }
  }

  /* Position helpers for the coach's explanations */
  function asTurn(g, color) {
    if (g.turn() === color) return { sim: g, same: true };

      p[3] = "-";
      return { sim: new Chess(p.join(" ")), same: false };
    } catch (e) {

    }
  }

  }

  function isLoose(g, sq, owner) {
    var pc = g.get(sq);
    if (!pc) return false;
    var enemy = owner === "w" ? "b" : "w";
    var t = asTurn(g, enemy);
    var att = t.sim.moves({ verbose: true }).filter(function (m) { return m.to === sq; });
    if (!att.length) return false;
    att.sort(function (a, b) { return PVAL[a.piece] - PVAL[b.piece]; });
    var a = att[0];
    if (PVAL[a.piece] < PVAL[pc.type]) return true;
    t.sim.move({ from: a.from, to: a.to, promotion: "q" });
    var recapture = t.sim.moves({ verbose: true }).some(function (m) { return m.to === sq; });
    if (t.same) g.undo();
    return !recapture;
  }

  function desc(m) {
    var p = { p: M("pn_" + m.piece), a: m.from, b: m.to };

    return M("desc", p);

  function explain(g, mv) {
    var good = [], warn = [];
    var me = mv.color, enemy = me === "w" ? "b" : "w";
    var v = PVAL[mv.piece], cv = mv.captured ? PVAL[mv.captured] : 0;
    var plies = g.history().length;
    var looseBefore = mv.piece !== "k" && isLoose(g, mv.from, me);

    g.move({ from: mv.from, to: mv.to, promotion: mv.promotion || "q" });
    var mate = g.in_checkmate(), check = g.in_check();
    var loose = !mate && mv.piece !== "k" && isLoose(g, mv.to, me);
    var targets = [];
    if (!mate) {

        if (m.from === mv.to && m.captured && PVAL[m.captured] >= 3 && PVAL[m.captured] < 100) {

    }
    g.undo();

    if (mv.flags.indexOf("k") > -1 || mv.flags.indexOf("q") > -1) {
      good.push(M("c_castle"));

    if (mv.captured) {
      good.push(M(cv > v ? "c_cap_a" : "c_cap_b", { p: M("pn_" + mv.captured), v: cv }));

    if (mv.promotion) {

    }
    if (mate) {

    } else if (check) {
      good.push(M("c_check"));
    }
    if (looseBefore && !loose) {
      good.push(M("c_safe"));
    }
    if (targets.length >= 2) {
      good.push(M("c_fork", { t: targets.map(function (c) { return M("pn_" + c); }) }));
    } else if (targets.length === 1) {
      good.push(M("c_tgt", { t: M("pn_" + targets[0]) }));

    if ((mv.piece === "n" || mv.piece === "b") && mv.from[1] === (me === "w" ? "1" : "8") && plies < 24) {
      good.push(M("c_dev"));
    }
    if (["d4", "e4", "d5", "e5"].indexOf(mv.to) > -1 && mv.piece !== "k" && plies < 30) {
      good.push(M("c_center"));
    }
    if (loose && v > cv) {
      warn.push(M("w_loose", { p: M("pn_" + mv.piece) }));
    }
    if (mv.piece === "q" && !mv.captured && plies < 12 && mv.from === (me === "w" ? "d1" : "d8")) {
      warn.push(M("w_queen"));
    }
    if (good.length === 0 && warn.length === 0) {
      good.push(M("c_default"));
    }
    return { good: good.slice(0, 3), warn: warn };
  }

    scores.forEach(function (x) {
      if (x.s > best.s) best = x;
      if (x.m.from === mv.from && x.m.to === mv.to && (x.m.promotion || "q") === (mv.promotion || "q")) chosen = x;
    });
    var loss = best.s - chosen.s;
    var alt = null;
    if (loss >= 90 && human !== "2") alt = { m: best.m, ex: explain(game, best.m) };

    game.move({ from: mv.from, to: mv.to, promotion: mv.promotion || "q" });
    lastMv = mv;

    var items = mine.good.slice();
    mine.warn.forEach(function (w) { items.push(M("warn_pre", { x: w })); });
    var title, cls;
    if (game.in_checkmate()) { title = human === "2" ? M("t_mate2", { s: SIDE[mv.color] }) : M("t_mate1"); cls = "good"; }
    else if (loss >= 250) { title = M("t_mistake", { d: desc(mv) }); cls = "bad"; items.push(M("c_engine")); }
    else if (loss >= 90) { title = M("t_ok", { d: desc(mv) }); cls = "warn"; }
    else { title = M("t_good", { d: desc(mv) }); cls = "good"; }
    if (human === "2") title = M("side_title", { s: SIDE[mv.color], t: title });
    if (alt) items.push(M("better", { d: desc(alt.m), x: alt.ex.good[0] || "" }));
    pushLog({ title: title, cls: cls, items: items });

    if (game.game_over() || human === "2") { afterMove(); return; }
    drawPlay();
    setTimeout(oppMove, 400);
  }

  function oppMove() {
    if (humanTurn() || game.game_over()) return;
    var m;
    if (level === 3) m = bestTimed(game);
    else {
      var sc = rootScores(game, level === 1 ? 1 : 2);
      sc.sort(function (a, b) { return b.s - a.s; });
      var pool = sc.filter(function (x) { return x.s >= sc[0].s - (level === 1 ? 200 : 30); });
      m = pool[Math.floor(Math.random() * pool.length)].m;
    }
    var ex = explain(game, m);
    game.move({ from: m.from, to: m.to, promotion: m.promotion || "q" });
    lastMv = m;
    var items = ex.good.slice(0, 2);
    ex.warn.forEach(function () { items.push(M("c_opp_loose")); });
    if (game.in_check()) items.push(M("c_in_check"));
    pushLog({ title: M("t_opp", { d: desc(m) }), cls: "info", items: items });
    afterMove();
  }

  playEl.addEventListener("click", function (e) {
    if (busy || game.game_over() || !humanTurn() || pending) return;
    var s = e.target.closest(".sq");
    if (!s) return;
    var name = FILES[parseInt(s.dataset.f, 10)] + (parseInt(s.dataset.r, 10) + 1);
    if (selSq) {
      var legal = game.moves({ square: selSq, verbose: true }).filter(function (m) { return m.to === name; });
      if (legal.length) {
        if (legal[0].promotion) { pending = legal; promoEl.hidden = false; return; }
        playUser(legal[0]);
        return;
      }
    }
    var p = game.get(name);
    selSq = p && p.color === game.turn() ? name : null;
    drawPlay();
  });

  [["q"], ["r"], ["b"], ["n"], ["x"]].forEach(function (x) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pick";
    b.setAttribute("data-i", x[0] === "x" ? "cancel" : "pn_" + x[0]);
    b.textContent = tl(x[0] === "x" ? "cancel" : "pn_" + x[0]);
    b.addEventListener("click", function () {
      if (!pending) return;
      if (x[0] === "x") { pending = null; promoEl.hidden = true; return; }
      var mv = pending.filter(function (m) { return m.promotion === x[0]; })[0];
      if (mv) playUser(mv);
    });
    promoPicks.appendChild(b);
  });

  hintBtn.addEventListener("click", function () {
    if (busy || game.game_over() || !humanTurn()) return;
    busy = true; selSq = null; pending = null; promoEl.hidden = true;
    drawPlay();
    setTimeout(function () {
      var m = bestTimed(game);
      var ex = explain(game, m);
      hintMv = m;
      var items = ex.good.slice();
      ex.warn.forEach(function (w) { items.push(M("warn_pre", { x: w })); });
      pushLog({ title: M("t_hint", { d: desc(m) }), cls: "hint", items: items });
      busy = false;
      drawPlay();
    }, 40);
  });

  undoBtn.addEventListener("click", function () {
    if (busy || !game.history().length) return;
    game.undo();
    if (human !== "2" && game.turn() !== human && game.history().length) game.undo();
    lastMv = null; hintMv = null; selSq = null; pending = null; promoEl.hidden = true;
    if (human !== "2" && !humanTurn() && !game.game_over()) { busy = true; drawPlay(); setTimeout(oppMove, 400); return; }
    drawPlay();
  });

  function newGame() {
    game = new Chess();
    selSq = null; lastMv = null; hintMv = null; busy = false; plog = []; pending = null; promoEl.hidden = true;
    flipped = human === "b";
    var intro = human === "2" ? M("intro2") : M("intro1", { s: SIDE[human], f: M(human === "b" ? "first_b" : "first_w") });
    pushLog({ title: M("t_start"), cls: "info", items: [intro] });
    drawPlay();
    if (human === "b") { busy = true; drawPlay(); setTimeout(oppMove, 500); }
  }

  function bindPicks(id, fn) {
    var box = document.getElementById(id);
    Array.prototype.forEach.call(box.children, function (b) {
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(box.children, function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
        fn(b.dataset.v);
      });
    });
  }
  bindPicks("sideP", function (v) { human = v; newGame(); });
  bindPicks("lvlP", function (v) { level = parseInt(v, 10); });
  newBtn.addEventListener("click", newGame);
  flipBtn.addEventListener("click", function () { flipped = !flipped; drawPlay(); });
  document.getElementById("playNow").addEventListener("click", function () { document.querySelector('[data-tab="play"]').click(); });
  newGame();

  function setLang(l) {
    LANG = l;
    try { localStorage.setItem("cs-lang", l); } catch (e) {}
    document.documentElement.lang = l === "ur" ? "ur-Latn" : "en";
    document.title = tl("title");
    applyStatic();
    Array.prototype.forEach.call(document.querySelectorAll(".lg"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    drawMoves(); showQ(); drawPlay(); renderLog();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".lg"), function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });
  setLang(LANG);

})();
</script>
